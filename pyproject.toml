[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volforecast"
version = "0.1.0"
description = "End-to-end MLOps pipeline for forecasting next-week realized volatility of S&P 500 constituents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "mlflow>=3.18,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Only needed to pull raw data from WRDS (requires a WRDS account with CRSP access)
ingest = [
    "wrds>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, NPY: numpy-specific
select = ["E", "W", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["volforecast"]
