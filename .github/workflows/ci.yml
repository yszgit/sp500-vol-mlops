name: CI

# Runs lint + tests on every push (any branch) and on every pull request into main.
# Branch protection on main requires both jobs to pass before a PR can be merged.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests (synthetic data, no WRDS access needed)
        run: pytest -v
